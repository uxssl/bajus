<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BAJUS Institute — Training Photo Gallery</title>
  <meta name="description" content="Training photo gallery from BAJUS Institute programmes, workshops, and skills development activities." />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="bajus-header"></div>

  <section class="page-hero py-16">
    <div class="max-w-7xl mx-auto px-6">
      <h1 class="font-serif text-4xl md:text-6xl leading-tight">BAJUS Institute — <span class="italic text-gold">Training Gallery</span></h1>
      <p class="mt-6 text-lg text-zinc-600 leading-relaxed">Photo documentation from BAJUS Institute training sessions, workshops, and skills development programmes.</p>
    </div>
  </section>

  <section class="py-20 max-w-7xl mx-auto px-6">
    <div class="flex items-end justify-between mb-10 border-b border-zinc-200 pb-5">
      <div>
        <span class="text-gold font-semibold uppercase tracking-[0.25em] text-xs mb-3 block">Training Archive</span>
        <h2 class="font-serif text-3xl text-charcoal">Training Photo Gallery</h2>
      </div>
      <div class="text-sm font-semibold text-gold uppercase tracking-wider">12 Photos</div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
      <button type="button" class="gallery-shot group relative overflow-hidden aspect-square bg-zinc-200 reveal" data-src="./assets/hero.jpg" data-alt="Workshop training floor">
        <img src="./assets/hero.jpg" alt="Workshop training floor" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" />
      </button>
      <button type="button" class="gallery-shot group relative overflow-hidden aspect-square bg-zinc-200 reveal" data-src="./assets/craft.jpg" data-alt="Goldsmith craft training">
        <img src="./assets/craft.jpg" alt="Goldsmith craft training" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" />
      </button>
      <button type="button" class="gallery-shot group relative overflow-hidden aspect-square bg-zinc-200 reveal" data-src="./assets/sliders/slider-1.jpg" data-alt="Institute classroom session">
        <img src="./assets/sliders/slider-1.jpg" alt="Institute classroom session" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" />
      </button>
      <button type="button" class="gallery-shot group relative overflow-hidden aspect-square bg-zinc-200 reveal" data-src="./assets/jewellery-1.jpg" data-alt="Practical jewellery making">
        <img src="./assets/jewellery-1.jpg" alt="Practical jewellery making" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" />
      </button>
      <button type="button" class="gallery-shot group relative overflow-hidden aspect-square bg-zinc-200 reveal" data-src="./assets/banner/banner_1.jpg" data-alt="Hands-on demonstration">
        <img src="./assets/banner/banner_1.jpg" alt="Hands-on demonstration" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" />
      </button>
      <button type="button" class="gallery-shot group relative overflow-hidden aspect-square bg-zinc-200 reveal" data-src="./assets/jewellery-3.jpg" data-alt="Finished training pieces">
        <img src="./assets/jewellery-3.jpg" alt="Finished training pieces" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" />
      </button>
      <button type="button" class="gallery-shot group relative overflow-hidden aspect-square bg-zinc-200 reveal" data-src="./assets/news2.jpg" data-alt="Technical briefing">
        <img src="./assets/news2.jpg" alt="Technical briefing" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" />
      </button>
      <button type="button" class="gallery-shot group relative overflow-hidden aspect-square bg-zinc-200 reveal" data-src="./assets/sliders/slider-2.jpg" data-alt="Group training session">
        <img src="./assets/sliders/slider-2.jpg" alt="Group training session" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" />
      </button>
      <button type="button" class="gallery-shot group relative overflow-hidden aspect-square bg-zinc-200 reveal" data-src="./assets/jewellery-4.jpg" data-alt="Assaying practice">
        <img src="./assets/jewellery-4.jpg" alt="Assaying practice" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" />
      </button>
      <button type="button" class="gallery-shot group relative overflow-hidden aspect-square bg-zinc-200 reveal" data-src="./assets/banner/banner_3.jpg" data-alt="Mentor review">
        <img src="./assets/banner/banner_3.jpg" alt="Mentor review" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" />
      </button>
      <button type="button" class="gallery-shot group relative overflow-hidden aspect-square bg-zinc-200 reveal" data-src="./assets/jewellery-5.jpg" data-alt="Student showcase">
        <img src="./assets/jewellery-5.jpg" alt="Student showcase" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" />
      </button>
      <button type="button" class="gallery-shot group relative overflow-hidden aspect-square bg-zinc-200 reveal" data-src="./assets/sliders/slider-3.jpg" data-alt="Closing day gallery">
        <img src="./assets/sliders/slider-3.jpg" alt="Closing day gallery" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" />
      </button>
    </div>
  </section>

  <div id="institute-lightbox" class="fixed inset-0 z-[60] hidden items-center justify-center bg-zinc-950/85 p-4" role="dialog" aria-modal="true">
    <button type="button" id="institute-lightbox-close" class="absolute top-5 right-5 size-11 rounded-full bg-white/10 text-cream hover:bg-gold transition-colors" aria-label="Close">
      <i class="bi bi-x-lg text-xl"></i>
    </button>
    <img id="institute-lightbox-image" src="" alt="" class="max-h-[85vh] max-w-[92vw] object-contain shadow-2xl" />
  </div>

  <div id="bajus-footer"></div>
  <script src="./js/include.js"></script>
  <script src="./js/main.js"></script>
  <script>
    (function () {
      const lightbox = document.getElementById("institute-lightbox");
      const image = document.getElementById("institute-lightbox-image");
      const closeBtn = document.getElementById("institute-lightbox-close");

      function openLightbox(src, alt) {
        image.src = src;
        image.alt = alt || "";
        lightbox.classList.remove("hidden");
        lightbox.classList.add("flex");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        lightbox.classList.add("hidden");
        lightbox.classList.remove("flex");
        document.body.style.overflow = "";
      }

      document.querySelectorAll(".gallery-shot").forEach((btn) => {
        btn.addEventListener("click", () => openLightbox(btn.dataset.src, btn.dataset.alt));
      });
      closeBtn.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });
    })();
  </script>
</body>
</html>
