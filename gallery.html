<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery — BAJUS</title>
  <meta name="description" content="Photo gallery of BAJUS events, leadership ceremonies, and industry exhibitions." />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="bajus-header"></div>

  <section class="page-hero py-16">
    <img class="page-hero__media" src="./assets/sliders/slider-1.jpg" alt="" aria-hidden="true" decoding="async" />
    <div class="max-w-7xl mx-auto px-6">
      <h1 id="gallery-hero-title" class="font-serif text-4xl md:text-6xl leading-tight">Moments from the <span class="italic text-gold">association</span>.</h1>
      <p id="gallery-hero-desc" class="mt-6 text-lg text-zinc-600 leading-relaxed">A visual record of BAJUS events, leadership milestones, exhibitions, and the craft itself.</p>
    </div>
  </section>

  <!-- ALBUM LIST -->
  <section id="gallery-albums" class="py-16 max-w-7xl mx-auto px-6">
    <div class="mb-6 reveal">
      <div class="text-[11px] uppercase tracking-[0.25em] text-gold font-bold mb-3">Visual Archive</div>
      <h2 class="font-serif text-3xl mb-8">Photo Galleries</h2>
    </div>
    <div id="gallery-albums-grid" class="board-members-grid grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 lg:gap-8 mb-16"></div>
  </section>

  <!-- ALBUM DETAIL -->
  <section id="gallery-detail" class="py-16 max-w-7xl mx-auto px-6 hidden">
    <div class="mb-10 reveal">
      <a href="./gallery.html" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-zinc-500 hover:text-gold transition-colors mb-6">
        <i class="bi bi-arrow-left"></i> All Galleries
      </a>
      <div class="flex flex-wrap items-end justify-between gap-4 border-b border-zinc-200 pb-5">
        <div>
          <div id="gallery-detail-meta" class="text-[11px] font-bold uppercase tracking-widest text-zinc-400 mb-2"></div>
          <h2 id="gallery-detail-title" class="font-serif text-3xl md:text-4xl text-charcoal"></h2>
          <p id="gallery-detail-desc" class="mt-3 text-sm text-zinc-600 max-w-3xl leading-relaxed"></p>
        </div>
        <div id="gallery-detail-count" class="text-sm font-semibold text-gold uppercase tracking-wider"></div>
      </div>
    </div>
    <div id="gallery-photos-grid" class="board-members-grid grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
  </section>

  <!-- LIGHTBOX -->
  <div id="gallery-lightbox" class="fixed inset-0 z-[60] hidden items-center justify-center bg-zinc-950/85 p-4" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button type="button" id="lightbox-close" class="absolute top-5 right-5 size-11 rounded-full bg-white/10 text-cream hover:bg-gold transition-colors" aria-label="Close">
      <i class="bi bi-x-lg text-xl"></i>
    </button>
    <button type="button" id="lightbox-prev" class="absolute left-4 md:left-8 size-11 rounded-full bg-white/10 text-cream hover:bg-gold transition-colors" aria-label="Previous">
      <i class="bi bi-chevron-left text-xl"></i>
    </button>
    <img id="lightbox-image" src="" alt="" class="max-h-[85vh] max-w-[92vw] object-contain shadow-2xl modal-media" />
    <button type="button" id="lightbox-next" class="absolute right-4 md:right-8 size-11 rounded-full bg-white/10 text-cream hover:bg-gold transition-colors" aria-label="Next">
      <i class="bi bi-chevron-right text-xl"></i>
    </button>
  </div>

  <div id="bajus-footer"></div>
  <script src="./js/gallery-data.js"></script>
  <script src="./js/include.js"></script>
  <script src="./js/main.js"></script>
  <script>
    (function () {
      const albums = window.BAJUS_GALLERIES || [];
      const params = new URLSearchParams(window.location.search);
      const albumId = params.get("album");
      const album = albumId ? window.getBajusGallery(albumId) : null;

      const albumsSection = document.getElementById("gallery-albums");
      const detailSection = document.getElementById("gallery-detail");
      const albumsGrid = document.getElementById("gallery-albums-grid");
      const photosGrid = document.getElementById("gallery-photos-grid");
      const heroTitle = document.getElementById("gallery-hero-title");
      const heroDesc = document.getElementById("gallery-hero-desc");

      let lightboxPhotos = [];
      let lightboxIndex = 0;
      const lightbox = document.getElementById("gallery-lightbox");
      const lightboxImage = document.getElementById("lightbox-image");

      function openLightbox(index) {
        lightboxIndex = index;
        const photo = lightboxPhotos[lightboxIndex];
        if (!photo) return;
        lightboxImage.src = photo.src;
        lightboxImage.alt = photo.alt || "";
        lightbox.classList.remove("hidden");
        lightbox.classList.add("flex");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        lightbox.classList.add("hidden");
        lightbox.classList.remove("flex");
        document.body.style.overflow = "";
      }

      function showLightbox(delta) {
        if (!lightboxPhotos.length) return;
        lightboxIndex = (lightboxIndex + delta + lightboxPhotos.length) % lightboxPhotos.length;
        openLightbox(lightboxIndex);
      }

      document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
      document.getElementById("lightbox-prev").addEventListener("click", () => showLightbox(-1));
      document.getElementById("lightbox-next").addEventListener("click", () => showLightbox(1));
      lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
      document.addEventListener("keydown", (e) => {
        if (lightbox.classList.contains("hidden")) return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft") showLightbox(-1);
        if (e.key === "ArrowRight") showLightbox(1);
      });

      function renderAlbums() {
        albumsGrid.innerHTML = albums.map((g) => {
          const count = g.photos.length;
          return `
            <a href="./gallery.html?album=${encodeURIComponent(g.id)}" class="group block reveal">
              <div class="aspect-[4/3] overflow-hidden bg-zinc-200 mb-4 relative">
                <img src="${g.cover}" alt="${g.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" loading="lazy" />
                <div class="absolute bottom-3 right-3 bg-charcoal/80 text-cream text-[10px] font-bold uppercase tracking-wider px-2.5 py-1">
                  ${count} Photo${count === 1 ? "" : "s"}
                </div>
              </div>
              <div class="text-[11px] font-bold uppercase tracking-widest text-zinc-400 mb-1.5">
                ${g.category} <span class="text-zinc-300">—</span> ${g.date}
              </div>
              <h3 class="text-lg font-serif text-charcoal leading-snug group-hover:text-gold transition-colors">${g.title}</h3>
            </a>
          `;
        }).join("");

        if (window.bajusObserveReveal) {
          window.bajusObserveReveal(albumsGrid);
        }
      }

      function renderAlbumDetail(g) {
        document.title = g.title + " — Gallery — BAJUS";
        heroTitle.innerHTML = g.title;
        heroDesc.textContent = g.description || "";
        document.getElementById("gallery-detail-meta").textContent = g.category + " — " + g.date;
        document.getElementById("gallery-detail-title").textContent = g.title;
        document.getElementById("gallery-detail-desc").textContent = g.description || "";
        document.getElementById("gallery-detail-count").textContent = g.photos.length + " Photos";

        lightboxPhotos = g.photos;
        photosGrid.innerHTML = g.photos.map((p, i) => `
          <button type="button" class="group relative overflow-hidden aspect-square bg-zinc-200 reveal text-left" data-index="${i}">
            <img src="${p.src}" alt="${p.alt || g.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" />
            <div class="absolute inset-0 bg-gradient-to-t from-zinc-900/50 via-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
          </button>
        `).join("");

        photosGrid.querySelectorAll("button[data-index]").forEach((btn) => {
          btn.addEventListener("click", () => openLightbox(Number(btn.dataset.index)));
        });

        albumsSection.classList.add("hidden");
        detailSection.classList.remove("hidden");

        requestAnimationFrame(() => {
          if (window.bajusObserveReveal) {
            window.bajusObserveReveal(detailSection);
          }
        });
      }

      if (album) {
        renderAlbumDetail(album);
      } else {
        renderAlbums();
      }
    })();
  </script>
</body>
</html>
